name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Tools and companions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run the suite
        run: python -m pytest tests/ -q
      - name: Companions match the archive
        run: python scripts/build_companions.py --check
